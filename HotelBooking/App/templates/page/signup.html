{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Aura Grand</title>
    <link rel="stylesheet" href="{% static 'style/signup.css' %}">
    <!-- Google Fonts & FontAwesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="auth-container">
        <!-- Back to Home Link -->
        <a href="{% url 'landing' %}" class="back-home"><i class="fa-solid fa-arrow-left"></i> Return to Home</a>

        <div class="auth-card">
            <!-- Brand Logo Header -->
            <div class="auth-header">
                <a href="{% url 'landing' %}" class="logo">
                    <span class="logo-mark">AG</span>
                    <span class="logo-text">AURA GRAND</span>
                </a>
                <p>Join the Aura Privilege Circle</p>
            </div>

            <!-- REGISTRATION FORM -->
            <form method="POST" class="auth-form active" id="signup">
                {% csrf_token %}

                <div class="form-group">
                    <label>Full Name</label>
                    {{ form.fullname }}
                </div>
    
                <div class="form-group">
                    <label>Email Address</label>
                    {{ form.email }}
                </div>

                <div class="form-group">
                    <label>Username</label>
                    {{ form.username }}
                    </div>

                <div class="form-group">
                    <label>Create Password</label>
                    {{ form.password1 }}
                </div>

                <div class="form-group">
                    <label>Confirm Password</label>
                    {{ form.password2 }}
                </div>

                <button type="submit" class="btn btn-primary btn-block">Create Membership Account</button>
            </form>

            <!-- Switch to Login -->
            <div class="auth-switch">
                <p>Already have an account? <a href="{% url 'login' %}">Sign In</a></p>
            </div>
        </div>
        
        <div class="auth-footer-note">
            <p>&copy; 2026 Aura Grand Hotel & Suites.
