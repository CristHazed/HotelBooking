<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Manual Booking - Luxious Hotel</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..700;1,400..700&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: #f7f4eb; 
            color: #1a2e26; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .booking-card {
            background: #ffffff;
            width: 100%;
            max-width: 480px;
            padding: 40px;
            border-radius: 8px;
            border: 1px solid #eae5d5;
            box-shadow: 0 8px 24px rgba(13, 35, 26, 0.06);
        }

        .brand-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 30px;
        }

        .brand-logo {
            width: 36px;
            height: 36px;
            border: 1px solid #c5a059;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #c5a059;
            font-family: 'Playfair Display', serif;
            font-weight: 700;
        }

        .brand-name {
            font-family: 'Playfair Display', serif;
            font-size: 14px;
            letter-spacing: 1.5px;
            line-height: 1.2;
            color: #0d231a;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 26px;
            color: #0d231a;
            margin-bottom: 8px;
            font-weight: 500;
        }

        p.subtitle {
            font-size: 13px;
            color: #5c756b;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #0d231a;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #e3dec9;
            border-radius: 6px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 14px;
            background: #faf8f2;
            color: #0d231a;
            transition: border-color 0.2s, background 0.2s;
        }

        input:focus {
            outline: none;
            border-color: #c5a059;
            background: #ffffff;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: #0d231a;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background: #c5a059;
            color: #0d231a;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #5c756b;
            text-decoration: none;
            font-size: 13px;
        }

        .back-link:hover {
            color: #0d231a;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="booking-card">
        <div class="brand-header">
            <div class="brand-logo">L</div>
            <div class="brand-name">LUXIOUS<br>HOTEL</div>
        </div>

        <h1>Guest Booking</h1>
        <p class="subtitle">Please enter guest credentials to process the reservation.</p>

        <!-- Form action can be pointed to your Django view URL -->
        <form method="POST" action="">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="fullname">Full Name</label>
                <input type="text" id="fullname" name="fullname" placeholder="e.g. Alexander Wright" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="e.g. alexander@example.com" required>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" placeholder="e.g. +63 912 345 6789" required>
            </div>

            <button type="submit" class="btn-submit">Confirm Reservation</button>
        </form>

        <a href="javascript:history.back()" class="back-link">&larr; Return to Dashboard</a>
    </div>

</body>
</html>
